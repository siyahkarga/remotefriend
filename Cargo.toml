[workspace]
members = ["crates/common", "crates/host", "crates/client"]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
bytes = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
quinn = { version = "0.11", features = ["rustls-ring"] }
rustls = "0.23"
rcgen = "0.13"
hostname = "0.4"
sha2 = "0.10"
hex = "0.4"
