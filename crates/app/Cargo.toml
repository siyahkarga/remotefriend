[package]
name = "remotefriend"
version = "0.6.4"
edition = "2021"
description = "Remote desktop: share this computer and control other computers"
homepage = "https://github.com/siyahkarga/remotefriend"
repository = "https://github.com/siyahkarga/remotefriend"
readme = "../../README.md"

[[bin]]
name = "remotefriend"
path = "src/main.rs"

[dependencies]
remote-friend-common = { path = "../common" }
remote-friend-host = { path = "../host" }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
image = { version = "0.25" }
serde_json = "1"
openh264 = "0.9"
eframe = "0.32"
egui = "0.32"
rfd = "0.15"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Linux package: `cargo deb -p remotefriend` (see .github/workflows/release.yml)
[package.metadata.deb]
name = "remotefriend"
maintainer = "RemoteFriend <noreply@github.com>"
copyright = "RemoteFriend contributors"
section = "net"
priority = "optional"
extended-description = """\
Share this computer and control other computers from a desktop app or any \
browser (including phones). Works on Wayland (GNOME/KDE), X11, Windows and macOS."""
depends = "$auto"
assets = [
    ["target/release/remotefriend", "usr/bin/", "755"],
    ["target/release/remote-friend-host", "usr/bin/", "755"],
    ["../../assets/remotefriend.desktop", "usr/share/applications/", "644"],
    ["../../assets/icon-256.png", "usr/share/icons/hicolor/256x256/apps/remotefriend.png", "644"],
    ["../../assets/icon.png", "usr/share/pixmaps/remotefriend.png", "644"],
]
