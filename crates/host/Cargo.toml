[package]
name = "remote-friend-host"
version = "0.1.0"
edition = "2021"

[dependencies]
remote-friend-common = { path = "../common" }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = "1"
xcap = "0.4"
openh264 = "0.9"
hostname = { workspace = true }
image = { version = "0.25", features = ["jpeg"] }
enigo = "0.6"
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
local-ip-address = "0.6"
base64 = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_HiDpi"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Wayland sessiz yakalama (Portal ScreenCast + PipeWire). Xorg'da xcap yeterli.
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast", "pipewire"] }
pipewire = "0.9"
memmap2 = "0.9"
libc = "0.2"
