name: release

# Tag push'layinca (ornek: v0.1.0) repo Releases sayfasina hazir exe'leri koyar.
# Kullanim:
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: remotefriend-windows
          - os: ubuntu-latest
            artifact: remotefriend-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Linux sistem bagimliliklari
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev

      - run: cargo build --release -p remote-friend-host -p remote-friend-client -p remote-friend-rendezvous

      - name: Windows paketi
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          copy target\release\remote-friend-host.exe dist\
          copy target\release\remote-friend-client.exe dist\
          copy target\release\remote-friend-rendezvous.exe dist\
          copy HOST_BASLAT.bat dist\

      - name: Linux paketi
        if: runner.os == 'Linux'
        run: |
          mkdir dist
          cp target/release/remote-friend-host target/release/remote-friend-client target/release/remote-friend-rendezvous dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.ref_name }}
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
