name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            host_ext: .exe
            artifact: remotefriend-windows
          - os: ubuntu-latest
            host_ext: ""
            artifact: remotefriend-linux
          - os: macos-latest
            artifact: remotefriend-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Linux sistem bagimliliklari
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev libpipewire-0.3-dev libspa-0.2-dev clang libclang-dev

      - name: Tum hedefleri kontrol et
        run: cargo check --locked --workspace --all-targets

      - name: Testler (protokol + host video/girdi)
        run: cargo test --locked -p remote-friend-common -p remote-friend-host

      - name: Release build
        if: runner.os != 'macOS'
        run: cargo build --locked --release -p remote-friend-host -p remote-friend-client -p remote-friend-rendezvous

      - name: macOS universal build (Apple Silicon + Intel)
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --locked --release -p remote-friend-host -p remote-friend-client --target aarch64-apple-darwin
          cargo build --locked --release -p remote-friend-host -p remote-friend-client --target x86_64-apple-darwin

      - name: Windows paketi hazirla
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          copy target\release\remote-friend-host.exe dist\
          copy target\release\remote-friend-client.exe dist\
          copy target\release\remote-friend-rendezvous.exe dist\
          copy start_remotefriend_win64.bat dist\
          
          copy README.md dist\

      - name: Linux paketi hazirla
        if: runner.os == 'Linux'
        run: |
          mkdir dist
          cp target/release/remote-friend-host target/release/remote-friend-client target/release/remote-friend-rendezvous dist/
          cp README.md dist/

      - name: macOS paketi hazirla
        if: runner.os == 'macOS'
        run: |
          mkdir dist
          for b in remote-friend-host remote-friend-client; do
            lipo -create target/aarch64-apple-darwin/release/$b target/x86_64-apple-darwin/release/$b -output dist/$b-macos
          done
          cp start_remotefriend_macos.command dist/
          cp README.md dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
